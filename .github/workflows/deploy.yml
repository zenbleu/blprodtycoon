name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Remove unavailable LFS media placeholders
        run: |
          # Missing portraits already have an in-game initials/color fallback.
          # Delete the 131-byte pointer files so Vite does not publish them as
          # if they were valid images.
          while IFS= read -r -d '' file; do
            if grep -q '^version https://git-lfs.github.com/spec/v1$' "$file"; then
              rm "$file"
            fi
          done < <(find public src/assets -type f \
            \( -name '*.jpg' -o -name '*.jpeg' -o -name '*.png' \) -print0)

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build
        env:
          # GitHub Pages is a repository/project site, not a domain-root site.
          # Keep the repository name in sync for forks and renamed repositories.
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
        
